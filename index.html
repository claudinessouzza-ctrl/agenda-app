<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Minha Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one readable column. Sticky header with tabs, day-grouped lists, month grid, notes grid, bottom sheets for editing, round add button at the bottom right. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --surface2:#E7ECF1; --ink:#14202A; --ink2:#566574; --line:#D9E0E7;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D5EEEB;
  --danger:#C2362C; --warn:#A86A0C;
  --c-trab:#3768D8; --c-pess:#D2693A; --c-saud:#CC3F68; --c-estu:#7C55CC; --c-fami:#C99200; --c-fina:#2A9159;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 10px 28px rgba(20,32,42,.10);
  --scrim:rgba(14,22,30,.45);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418; --surface:#162027; --surface2:#1F2C35; --ink:#E6EDF2; --ink2:#93A3B1; --line:#27353F;
    --accent:#3FC1B5; --accent-ink:#06211F; --accent-soft:#12343A;
    --danger:#FF7B6E; --warn:#E3B04B;
    --c-trab:#7C9CF0; --c-pess:#F0935F; --c-saud:#F27A9C; --c-estu:#A88BEB; --c-fami:#E8BC3A; --c-fina:#5CC98A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --surface2:#1F2C35; --ink:#E6EDF2; --ink2:#93A3B1; --line:#27353F;
  --accent:#3FC1B5; --accent-ink:#06211F; --accent-soft:#12343A;
  --danger:#FF7B6E; --warn:#E3B04B;
  --c-trab:#7C9CF0; --c-pess:#F0935F; --c-saud:#F27A9C; --c-estu:#A88BEB; --c-fami:#E8BC3A; --c-fina:#5CC98A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:720px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.brand p{color:var(--ink2);font-size:13px;margin-top:2px;text-transform:capitalize}
.tools{display:flex;gap:4px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative}
.ib:hover{background:var(--surface2)}
.badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font:600 11px/18px var(--f-body);text-align:center;padding:0 5px}
.searchrow{padding-top:8px}
.searchrow input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;min-height:38px}
.chip i,.mc i,.cp i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* alerts banners */
#banners{display:grid;gap:8px;margin:4px 0 8px}
.alert{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.alert b{display:block;font-weight:600}
.alert span{color:var(--ink2);font-size:13px}
.ab{display:flex;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;margin-bottom:18px}
.hero .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h2{font-family:var(--f-display);font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:6px 0 8px;text-wrap:balance}
.hbtn{display:block;width:100%}
.hero .when{font-size:14px}
.hero .sum{margin-top:10px;font-size:13px;opacity:.85}

/* day groups */
.day{margin-bottom:18px}
.day h2{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--ink2);padding:0 4px 8px;text-transform:capitalize}
.day h2 em{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:400}
.day.today h2{color:var(--accent)}
.day.late h2{color:var(--warn)}
.day ul{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ev{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.chk{width:52px;flex:none;display:grid;place-items:center}
.chk span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.ev.done .chk span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.em{flex:1;min-width:0;display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:start;padding:13px 14px 13px 0;text-align:left}
.tm{font-family:var(--f-mono);font-size:14px;font-weight:500;display:flex;flex-direction:column;line-height:1.25}
.tm small{color:var(--ink2);font-size:12px;font-weight:400}
.tm.all{font-family:var(--f-body);font-size:12px;color:var(--ink2);font-weight:500}
.dd{grid-column:1 / -1;font-size:12px;color:var(--ink2);margin-bottom:-4px;text-transform:capitalize}
.bd{min-width:0}
.bd b{display:block;font-weight:600;overflow-wrap:anywhere}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink2);font-size:13px;margin-top:3px}
.mt span{display:inline-flex;align-items:center;gap:4px}
.ev.done .bd b{text-decoration:line-through;color:var(--ink2)}
.ev.done .tm{opacity:.55}
.none{padding:16px;color:var(--ink2);font-size:14px}
.foot{color:var(--ink2);font-size:13px;text-align:center;padding:4px 0 12px}

/* month */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead h2{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.mhead .nav{display:flex;align-items:center;gap:2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--ink2);text-align:center;padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cell{min-height:58px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cell .dn{font-family:var(--f-mono);font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.out{background:transparent;border-color:transparent;color:var(--ink2);opacity:.7}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.cell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dots{display:flex;gap:3px;align-items:center;min-height:8px}
.dots span{width:7px;height:7px;border-radius:50%}
.dots i{font-style:normal;font-size:10px;color:var(--ink2);line-height:1}
.sel-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;gap:8px}
.sel-h h3{font-family:var(--f-display);font-size:16px;text-transform:capitalize}

/* notes */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.note:hover{border-color:var(--ink2)}
.note h3{font-family:var(--f-display);font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.note .nb{color:var(--ink2);font-size:14px;display:grid;gap:3px;overflow-wrap:anywhere}
.note .nb p{margin:0}
.note .nf{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink2);font-size:12px;margin-top:auto}
.note .nf span{display:inline-flex;align-items:center;gap:4px}
.tl{display:flex;gap:8px;align-items:flex-start}
.tl .tb{width:22px;height:22px;flex:none;display:grid;place-items:center;margin:-2px 0 0 -3px}
.tl .tb span{width:16px;height:16px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;color:transparent}
.tl.on .tb span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl.on>span{text-decoration:line-through}

/* empty and loading */
.empty{text-align:center;padding:48px 16px;display:grid;gap:10px;justify-items:center}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h2{font-family:var(--f-display);font-size:20px}
.empty p{color:var(--ink2);max-width:36ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.skel{display:grid;gap:12px}
.skel div{height:64px;border-radius:16px;background:var(--surface2)}

/* add button */
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
@media (min-width:760px){.fab{right:calc(50% - 360px + 8px)}}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px 20px}
.sh-h h2{font-family:var(--f-display);font-size:20px}
.sh-b{overflow:auto;padding:8px 20px 16px;display:grid;gap:14px;align-content:start}
.sh-f{display:flex;gap:8px;justify-content:space-between;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-f .grp{display:flex;gap:8px}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.inp,.sel,.txa{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.txa{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.5}
.inp:disabled{opacity:.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.three{grid-template-columns:1fr 1fr}.three>.fld:first-child{grid-column:1 / -1}}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cp{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;min-height:40px;cursor:pointer}
.cp input{position:absolute;opacity:0;inset:0;cursor:pointer}
.cp:has(input:checked){background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c);font-weight:600}
.cp:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:500}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:42px;height:24px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink2);transition:transform .15s}
.sw input:checked+.tr{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(18px);background:var(--accent-ink)}
.sw input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--ink2)}
.err{color:var(--danger);font-size:14px;font-weight:500}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 10px;min-width:0}
.file .th{width:40px;height:40px;border-radius:8px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;font:500 10px var(--f-mono);color:var(--ink2);text-transform:uppercase}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .fi{flex:1;min-width:0}
.file .fi a,.file .fi button{display:block;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.file .fi small{color:var(--ink2);font-size:12px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink2);font-weight:500;cursor:pointer}
.up:hover{border-color:var(--accent);color:var(--accent)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.up:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tbar{display:flex;gap:6px;flex-wrap:wrap}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{font-weight:600;display:block}
.li small{color:var(--ink2)}
.sec{font-family:var(--f-display);font-size:15px;margin-top:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Ajustes para iPhone */
html{-webkit-tap-highlight-color:transparent}
button,.tab,.chip,.cell,.ev{touch-action:manipulation}
@media (max-width:760px){.inp,.sel,.txa,.searchrow input{font-size:16px}}
.sheet{max-height:92vh;max-height:92dvh}
@media (min-width:700px){.sheet{max-height:88vh;max-height:88dvh}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="bar">
      <div class="brand"><h1>Minha Agenda</h1><p id="sub"></p></div>
      <div class="tools">
        <button class="ib" id="bSearch" aria-label="Buscar" aria-expanded="false"></button>
        <button class="ib" id="bBell" aria-label="Avisos"></button>
        <button class="ib" id="bMore" aria-label="Mais opções"></button>
      </div>
    </div>
    <div class="searchrow" id="searchrow" hidden>
      <input type="search" id="q" placeholder="Buscar compromissos e notas" autocomplete="off" aria-label="Buscar compromissos e notas">
    </div>
    <div class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" id="t-agenda" data-act="tab" data-tab="agenda">Agenda</button>
      <button class="tab" role="tab" id="t-month" data-act="tab" data-tab="month">Mês</button>
      <button class="tab" role="tab" id="t-notes" data-act="tab" data-tab="notes">Notas</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="banners" aria-live="polite"></div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Novo compromisso"></button>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Camada de compatibilidade: dá à agenda, fora do Claude, o armazenamento de anexos (IndexedDB),
   o salvamento de arquivos (compartilhar/baixar) e deixa o resto funcionando com dados no aparelho. */
(function(){
  'use strict';
  if(window.claude&&window.claude.use)return;
  var DBN='agenda-files',ST='files';
  function idb(){
    return new Promise(function(res,rej){
      var r=indexedDB.open(DBN,1);
      r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST,{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    });
  }
  function tx(mode,fn){
    return idb().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction(ST,mode),req=fn(t.objectStore(ST));
        t.oncomplete=function(){db.close();res(req?req.result:undefined)};
        t.onerror=t.onabort=function(){db.close();rej(t.error)};
      });
    });
  }
  function rid(){
    var a=new Uint8Array(16);
    (window.crypto||window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  }
  function swReady(){return !!(navigator.serviceWorker&&navigator.serviceWorker.controller)}

  var assets={
    upload:function(blob,o){

    }
  };

  var MIME={json:'application/json',txt:'text/plain',csv:'text/csv',md:'text/markdown',pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm'};

function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}

/* ---------- recurrence ---------- */
function occursOn(ev,k){
  if(k<ev.date)return false;
  var r=ev.repeat||'none';
  if(r==='none')return k===ev.date;
  if(r==='daily')return true;
  var a=pk(ev.date),b=pk(k);
  if(r==='weekly')return a.getDay()===b.getDay();
  if(r==='monthly')return a.getDate()===b.getDate();
  if(r==='yearly')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false;
}
function occurrencesBetween(from,to){
  var out=[],evs=S.items.filter(function(i){return i.kind==='event'});
  for(var k=from;k<=to;k=addDays(k,1)){
    for(var i=0;i<evs.length;i++){
      var ev=evs[i];
      if(occursOn(ev,k))out.push({ev:ev,date:k,key:ev.id+'@'+k,done:!!(ev.done&&ev.done[k])});
    }
  }
  out.sort(function(a,b){
    if(a.date!==b.date)return a.date<b.date?-1:1;
    if(!!a.ev.allDay!==!!b.ev.allDay)return a.ev.allDay?-1:1;
    return (a.ev.start||'')<(b.ev.start||'')?-1:(a.ev.start||'')>(b.ev.start||'')?1:0;
  });
  return out;
}
function startTs(o){var p=(o.ev.start||'08:00').split(':').map(Number);var d=pk(o.date);d.setHours(p[0],p[1],0,0);return d.getTime()}
function alertAt(o){var m=o.ev.remind;if(m==null||m<0)return null;return startTs(o)-m*60000}
var passCat=function(it){return S.cat==='all'||it.cat===S.cat};
function until(ts){
  var m=Math.round((ts-Date.now())/60000);
  if(m<1)return 'agora';
  if(m<60)return 'em '+m+' min';
  var h=Math.floor(m/60),mm=m%60;
  if(h<24)return 'em '+h+' h'+(mm?' '+mm+' min':'');
  var d=Math.floor(h/24);return 'em '+d+(d===1?' dia':' dias');
}

/* ---------- alerts ---------- */
var fired=new Set(lsGet('agenda.fired',[]));
var snooze={};var active=[];var AC=null;var lastMin=0;
function saveFired(){var a=Array.from(fired);if(a.length>400)a=a.slice(-300);lsSet('agenda.fired',a)}
function beep(){
  try{
    if(!AC)return;var t0=AC.currentTime;
    [880,1175].forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001,t0+i*.18);g.gain.exponentialRampToValueAtTime(.2,t0+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.18+.3);
      o.start(t0+i*.18);o.stop(t0+i*.18+.32);
    });
    if(navigator.vibrate)navigator.vibrate([120,60,120]);

}
document.addEventListener('pointerdown',function(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

},{passive:true});
function markPastAlerts(it){
  var t=todayKey(),now=Date.now();
  var tmp=S.items.filter(function(x){return x.id!==it.id});tmp.push(it);
  var save=S.items;S.items=tmp;
  occurrencesBetween(addDays(t,-1),addDays(t,1)).filter(function(o){return o.ev.id===it.id}).forEach(function(o){
    var at=alertAt(o);if(at!=null&&at<now)fired.add(o.key+'#'+at);
  });

}
function tick(){
  if(!S.ready)return;
  var now=Date.now(),t=todayKey(),changed=false;
  var occ=occurrencesBetween(addDays(t,-1),addDays(t,1));
  var valid={};
  occ.forEach(function(o){
    if(o.done)return;
    var at=alertAt(o);if(at==null)return;
    var key=o.key+'#'+at;valid[key]=1;
    var sn=snooze[key];
    var due=sn?now>=sn:(now>=at&&now-at<6*3600e3);
    if(due&&!fired.has(key)&&!active.some(function(a){return a.key===key})){
      active.push({key:key,o:o,at:at});delete snooze[key];changed=true;
    }
  });
  var before=active.length;
  active=active.filter(function(a){return valid[a.key]});
  if(active.length!==before)changed=true;
  if(changed){renderAlerts();if(active.length)beep()}

function dismissAlert(key){fired.add(key);delete snooze[key];active=active.filter(function(a){return a.key!==key});saveFired();renderAlerts();if(!$('#ov').hidden&&sheetKind==='alerts')openAlerts()}
function snoozeAlert(key){snooze[key]=Date.now()+10*60000;active=active.filter(function(a){return a.key!==key});renderAlerts();toast('Aviso adiado por 10 minutos');if(!$('#ov').hidden&&sheetKind==='alerts')openAlerts()}

}

    +'<button class="btn" data-act="samples">Ver exemplos</button></div></div>';

function row(o,showDate){
  var ev=o.ev,c=cvar(ev.cat);
  var time=ev.allDay?'<span class="tm all">Dia todo</span>':'<span class="tm">'+esc(ev.start)+(ev.end?'<small>'+esc(ev.end)+'</small>':'')+'</span>';
  var meta=['<span class="mc"><i style="background:'+c+'"></i>'+esc(catOf(ev.cat).n)+'</span>'];
  if(ev.loc)meta.push('<span>'+ic('map',13)+esc(ev.loc)+'</span>');

    +'<button class="chk" data-act="done" data-id="'+esc(ev.id)+'" data-date="'+o.date+'" aria-pressed="'+o.done+'" aria-label="Concluído: '+esc(ev.title)+'"><span>'+ic('check',15)+'</span></button>'

function hero(t){
  var now=Date.now();
  var occ=occurrencesBetween(t,addDays(t,60)).filter(function(o){return !o.done&&!o.ev.allDay&&passCat(o.ev)});
  var nx=occ.filter(function(o){return startTs(o)>=now})[0];
  var all=occurrencesBetween(t,t),done=all.filter(function(o){return o.done}).length;
  var sum=all.length?all.length+(all.length===1?' compromisso hoje':' compromissos hoje')+' · '+done+(done===1?' concluído':' concluídos'):'Nada marcado para hoje';
  if(!nx)return '<section class="hero"><p class="lab">Próximo compromisso</p><h2>Nada à vista por enquanto</h2><p class="when">Aproveite o tempo livre ou anote algo novo.</p><p class="sum">'+sum+'</p></section>';
  var ev=nx.ev,rd=relDay(nx.date)||fmtShort(nx.date);
  return '<section class="hero"><p class="lab">Próximo compromisso</p>'
    +'<button class="hbtn" data-act="open" data-id="'+esc(ev.id)+'"><h2>'+esc(ev.title)+'</h2></button>'
    +'<p class="when mono">'+esc(rd)+', '+esc(ev.start)+' <span>· '+until(startTs(nx))+'</span></p><p class="sum">'+sum+'</p></section>';

function renderAgenda(){
  var t=todayKey();
  if(!S.items.some(function(i){return i.kind==='event'}))
    return empty('cal','Sua agenda está vazia','Anote consultas, reuniões, contas e prazos. Cada compromisso pode ter lembrete, anexos e notas.');
  var h=hero(t);
  var over=occurrencesBetween(addDays(t,-30),addDays(t,-1)).filter(function(o){return !o.done&&o.ev.repeat==='none'&&passCat(o.ev)});
  if(over.length)h+='<section class="day late"><h2><span>Atrasados</span><em>'+over.length+'</em></h2><ul>'+over.map(function(o){return row(o,true)}).join('')+'</ul></section>';
  var occ=occurrencesBetween(t,addDays(t,60)).filter(function(o){return passCat(o.ev)});
  var by={};occ.forEach(function(o){(by[o.date]=by[o.date]||[]).push(o)});
  if(!by[t])by[t]=[];
  Object.keys(by).sort().forEach(function(k){
    var list=by[k],rel=relDay(k);
    h+='<section class="day'+(k===t?' today':'')+'"><h2><span>'+(rel?rel+' · ':'')+esc(fmtDay(k))+'</span><em>'+list.length+'</em></h2><ul>'
      +(list.length?list.map(function(o){return row(o)}).join(''):'<li class="none">Nada marcado para hoje.</li>')+'</ul></section>';
  });
  h+='<p class="foot">Mostrando os próximos 60 dias. Use o Mês ou a busca para ver mais adiante.</p>';
  return h;
}

function renderMonth(){

var TYPES={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',pdf:'application/pdf',csv:'text/csv',md:'text/markdown',json:'application/json',txt:'text/plain'};
function fileType(f){var e=(f.name.split('.').pop()||'').toLowerCase();return TYPES[e]||null}
function toDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(f)})}
function dataToBlob(u){var p=u.split(','),m=/data:([^;]*)/.exec(p[0]),bin=atob(p[1]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:'application/octet-stream'})}
async function addFiles(list){
  var hint=$('#f-hint');
  for(var i=0;i<list.length;i++){
    var f=list[i],type=fileType(f),att={name:f.name,type:type||f.type||'',size:f.size};
    if(hint)hint.textContent='Enviando '+f.name+'…';
    var done=false;
    if(assets&&type&&f.size<=20*1048576){
      try{var r=await assets.upload(f,{type:type});att.aid=r.id;done=true}catch(e){done=false}
    }
    if(!done){
      if(f.size<=150*1024){try{att.data=await toDataURL(f);done=true}catch(e){}}
    }
    if(done)draftFiles.push(att);else toast('Não consegui anexar “'+f.name+'”. Use PDF ou imagem para arquivos grandes.','err');
  }
  var fl=$('#flist');if(fl)fl.innerHTML=fileRows();
  if(hint)hint.textContent='PDF, imagens, vídeos, TXT, CSV e MD até 20 MB. Outros formatos (Word, Excel) até 150 KB.';

}

async function exportBackup(){

  try{

    for(var i=0;i<items.length;i++){
      var fl=items[i].files||[];
      for(var j=0;j<fl.length;j++){

      }
    }
    var data=JSON.stringify({app:'minha-agenda',version:1,exported:new Date().toISOString(),items:items},null,2);
    try{await dl.save({filename:'agenda-backup-'+todayKey()+'.json',data:data});toast('Backup salvo')}
    catch(e){
      if(e&&e.code==='needs_tap'&&btn){pendingSave=e.retry;btn.disabled=false;btn.dataset.act='exportretry';btn.textContent='Toque para salvar'}
      else if(!e||e.code!=='declined')toast('Não foi possível salvar o backup.','err');
    }

async function importBackup(file){
  try{
    var txt=await file.text();
    var j=JSON.parse(txt),arr=Array.isArray(j)?j:j.items;
    var ok=(arr||[]).filter(function(x){return x&&x.id&&(x.kind==='event'||x.kind==='note')});
    if(!ok.length)throw new Error('vazio');
    var lost=0;
    for(var i=0;i<ok.length;i++){
      var it=ok[i],keep=[],fl=it.files||[];
      for(var k=0;k<fl.length;k++){
        var f=fl[k];
        if(f.aid){
          var have=window.__af?await window.__af.has(f.aid):true;
          if(have)keep.push(f);else lost++;
        }else if(f.data&&(f.size||0)>150*1024&&assets){
          try{var up=await assets.upload(dataToBlob(f.data),{type:f.type||'application/octet-stream'});keep.push({name:f.name,type:f.type,size:f.size,aid:up.id})}catch(e){keep.push(f)}
        }else keep.push(f);
      }
      it.files=keep;
      putItem(it);
    }
    closeSheet();toast(ok.length+' itens importados'+(lost?' ('+lost+' anexos não puderam ser restaurados)':''));
  }catch(e){toast('Arquivo de backup inválido.','err')}
}

/* ---------- events ---------- */
function findItem(id){return S.items.filter(function(x){return x.id===id})[0]}
function newEventDate(){return S.tab==='month'?S.sel:todayKey()}
function act(el,e){
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'tab':S.tab=el.dataset.tab;render();break;
    case 'cat':S.cat=el.dataset.cat;render();break;
    case 'new':openEventForm(null,el.dataset.date||newEventDate());break;
    case 'newnote':openNoteForm(null);break;
    case 'open':var ev=findItem(id);if(ev)openEventForm(ev);break;
    case 'nopen':var n=findItem(id);if(n)openNoteForm(n);break;
    case 'done':
      var it=findItem(id);if(!it)break;
      var c=clean(it);c.done=c.done||{};if(c.done[el.dataset.date])delete c.done[el.dataset.date];else c.done[el.dataset.date]=true;
      putItem(c);tick();break;
    case 'ntoggle':
      var nt=findItem(id);if(!nt)break;
      var lines=(nt.body||'').split('\n'),i=+el.dataset.line;
      if(lines[i])lines[i]=(lines[i].charAt(0)==='☑'?'☐':'☑')+lines[i].slice(1);
      var nn=clean(nt);nn.body=lines.join('\n');nn.updated=Date.now();putItem(nn);break;
    case 'day':S.sel=el.dataset.date;S.month=S.sel.slice(0,7);renderMain();break;
    case 'mprev':case 'mnext':
      var y=+S.month.slice(0,4),m=+S.month.slice(5,7)-1+(a==='mnext'?1:-1);var d=new Date(y,m,1);S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);renderMain();break;
    case 'mtoday':S.sel=todayKey();S.month=S.sel.slice(0,7);renderMain();break;
    case 'close':closeSheet();break;
    case 'esave':saveEvent();break;
    case 'nsave':saveNote();break;
    case 'edel':confirmDelete(el,function(){var i=editing&&editing.id;closeSheet();if(i){delItem(i);toast('Compromisso excluído')}});break;
    case 'ndel':confirmDelete(el,function(){var i=editing&&editing.id;closeSheet();if(i){delItem(i);toast('Nota excluída')}});break;
    case 'frem':draftFiles.splice(+el.dataset.i,1);$('#flist').innerHTML=fileRows();break;
    case 'fsave':
      var f=draftFiles[+el.dataset.i];
      if(f&&f.data&&dl)dl.save({filename:f.name,data:dataToBlob(f.data)}).catch(function(e){if(!e||e.code!=='declined')toast('Não foi possível baixar este arquivo aqui.','err')});
      else toast('Este arquivo não pode ser aberto aqui.','err');
      break;
    case 'ins':
      var ta=$('#n-body'),s=el.dataset.s,pos=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',pos-1)+1;
      ta.value=v.slice(0,ls)+s+v.slice(ls);ta.focus();ta.selectionStart=ta.selectionEnd=pos+s.length;break;
    case 'asnooze':snoozeAlert(el.dataset.key);break;
    case 'adismiss':dismissAlert(el.dataset.key);break;
    case 'bell':openAlerts();break;
    case 'samples':addSamples();break;
    case 'unsample':S.items.filter(function(i){return i.sample}).forEach(function(i){delItem(i.id)});closeSheet();toast('Exemplos removidos');break;
    case 'export':exportBackup();break;
    case 'exportretry':if(pendingSave){pendingSave().then(function(){toast('Backup salvo');closeSheet()}).catch(function(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o backup.','err')})}break;
  }
}
document.addEventListener('click',function(e){
  var ov=$('#ov');
  if(e.target===ov){closeSheet();return}
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  act(el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#ov').hidden){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();act(e.target,e)}
  if(e.key==='Tab'&&!$('#ov').hidden){
    var f=Array.prototype.slice.call($('#sheet').querySelectorAll('button,input,select,textarea,a[href]')).filter(function(x){return !x.disabled&&x.offsetParent!==null&&x.type!=='file'});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#sheet'))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-allday'){$('#f-start').disabled=t.checked;$('#f-end').disabled=t.checked;if(!t.checked&&!$('#f-start').value)$('#f-start').value='09:00'}
  else if(t.id==='f-repeat'){$('#f-rhint').hidden=t.value==='none'}
  else if(t.id==='f-file'&&t.files&&t.files.length){addFiles(Array.prototype.slice.call(t.files))}
  else if(t.id==='imp'&&t.files&&t.files[0]){importBackup(t.files[0])}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;renderMain()});
$('#bSearch').addEventListener('click',function(){
  var r=$('#searchrow');r.hidden=!r.hidden;this.setAttribute('aria-expanded',String(!r.hidden));
  if(!r.hidden)$('#q').focus();else{S.q='';$('#q').value='';renderMain()}
});
$('#bBell').addEventListener('click',openAlerts);
$('#bMore').addEventListener('click',openMore);
$('#fab').addEventListener('click',function(){if(S.tab==='notes')openNoteForm(null);else openEventForm(null,newEventDate())});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();renderMain()}});

/* ---------- start ---------- */
render();
initStore();
setInterval(tick,15000);
})();
</script>

</body>
